.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<style id="tcss">
.page{--navy:#0a1f44;--red:#d1202f;--red-dark:#b3131f;--red-soft:#fde8ea;--bg:#eef1f7;--line:#d8dfeb;--muted:#5b6b85;width:210mm;min-height:297mm;background:var(--bg);display:flex;flex-direction:column;font:13px/1.4 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;color:var(--navy);text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page *{box-sizing:border-box;margin:0;padding:0}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.head{position:relative;background:var(--navy);color:#fff;padding:26px 14mm 70px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;border-bottom:4px solid var(--red)}
.head .map{position:absolute;inset:0;width:100%;height:100%;opacity:.14}
.logo-wrap,.head-title{position:relative}
.logo-wrap{background:#fff;border-radius:10px;padding:9px 14px;display:flex;align-items:center;min-height:50px;font-weight:800;font-size:15px}
.logo-wrap img{max-height:44px;display:block}
.head-title{text-align:right}
.head-title h1{font-size:28px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.head-title p{font-size:12.5px;color:#b9c6e0;margin-top:5px}
.head-title em{display:block;font-size:12px;color:#ff8d97;margin-top:2px}
.main{position:relative;margin-top:-46px;padding:0 14mm 24px;flex:1;display:flex;flex-direction:column;gap:18px}
.pass{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(10,31,68,.14)}
.pass-top{display:flex;justify-content:space-between;align-items:center;padding:20px 26px 16px;gap:12px}
.pax small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.pax strong{display:block;font-size:23px;font-weight:800;letter-spacing:.2px}
.pax.m strong{font-size:17px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;white-space:nowrap}
.airline-row{display:flex;justify-content:space-between;align-items:center;background:#f3f5fa;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 26px;font-size:13px;font-weight:700}
.airline-row span:first-child{display:flex;align-items:center;gap:8px}
.airline-row .ic{color:var(--red);transform:rotate(90deg)}
.airline-row span:last-child{color:var(--muted);font-weight:500}
.airline-row b{color:var(--navy);font-weight:800}
.route{display:grid;grid-template-columns:1fr 50mm 1fr;gap:4mm;align-items:start;padding:28px 26px 26px}
.apt.dest{text-align:right}
.code{font-size:68px;font-weight:800;line-height:.95;letter-spacing:-2.5px}
.city{font-size:16px;font-weight:700;margin-top:8px}
.time{font-size:20px;font-weight:800;margin-top:16px}
.time em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
.date{font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}
.term{margin-top:12px;font-size:12px;color:var(--red-dark);font-weight:700;line-height:1.45}
.term b{display:block;color:var(--navy)}
.mid{padding-top:14px;text-align:center}
.dur{font-size:13px;font-weight:800;min-height:18px}
.arc{width:100%;height:auto;display:block;margin-top:4px}
.stops{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.4}

.cell{padding:16px 22px;border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.cell small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
.cell span{font-size:14px;font-weight:700}
.cell.pnr{background:var(--red);border-right:0}
.cell.pnr small{color:#ffd3d7}
.cell.pnr span{color:#fff;font-size:26px;font-weight:800;letter-spacing:3px}

.bag{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile{width:46px;height:46px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.tile .ic{width:24px;height:24px}
.bag small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.bag strong{font-size:20px;font-weight:800}
.tips{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.tips h2{font-size:14px;font-weight:800;margin-bottom:10px}
.tips ul{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tips li{display:flex;gap:9px;font-size:12px;line-height:1.5;color:#3d4c6b}
.tips .ic{color:var(--navy);margin-top:2px}
.foot{background:var(--navy);color:#fff;border-top:4px solid var(--red);padding:22px 14mm;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:12.5px;line-height:1.6}

.issued{text-align:right}

.issued b{font-size:15px;font-weight:700}
.issued div+div{margin-top:10px}

blank=()=>({id:'t'+Date.now(),pax:'',pnr:'',cls:'Economy',trip:'One-way',st:'Confirmed',issue:new Date().toISOString().slice(0,10),bc:'',bh:'',...pick(AGENCY),segs:[seg()]});
let cur={...blank(),pax:'MR NUR MOHAMMAD ALI',pnr:'84DK4K',cls:'Economy (CLSAO)',issue:'2026-11-10',bc:'60 Kg',bh:'7 Kg (1 piece)',segs:[{al:'Biman Bangladesh',ac:'BG',fn:'136',dur:'08 hrs 20 mins',stops:'Non Stop,f:{c:'JED',city:'Jeddah',apt:'King Abdulaziz Intl',term:'Terminal H',date:'2026-11-12',time:'22:45'},t:{c:'DAC',city:'Dhaka',apt:'Hazrat Shahjalal Intl',term:'Terminal 2',date:'2026-11-13',time:'10:05'}}]};
let store=null,saved=[],dirty=0,loaded=0,tm;

/* ticket */
function tk(t){
  const N=t.pax.split('\n').map(s=>s.trim()).filter(Boolean),n=N.length||1,pl=n>1?'s':'',
  ap=(p,e)=>`<div class="code">${x(p.c)}</div><div class="city">${x(p.city)}</div><div class="time">${t12(p.time)}${e?` <em>(${esc(e)})</em>`:''}</div><div class="date">${fd(p.date)}</div><div class="term"><b>${x(p.apt)}</b>${esc(p.term)}</div>`,
  sg=s=>{const nx=s.t.date&&s.f.date&&s.t.date>s.f.date;return`<div class="airline-row"><span><svg class="ic"><use href="#i-plane"/></svg>${x(s.al)}</span><span>Flight <b>${fno(s)}</b></span></div><div class="route"><div class="apt">${ap(s.f,s.f.time)}</div><div class="mid"><div class="dur">${esc(s.dur)}</div>${arc(s.stops&&!/non|direct/i.test(s.stops))}<div class="stops">${esc(s.stops)}</div></div><div class="apt dest">${ap(s.t,nx?'next day':s.t.time)}</div></div>`};
  return SPR+`<div class="page"><header class="head">${MAP}<div class="logo-wrap">${AGENCY.logo?`<img src="${AGENCY.logo}" alt="">`:x(t.company)}</div><div class="head-title"><h1>E-Ticket</h1><p>${esc(t.company)}</p>${t.tag?`<em>${esc(t.tag)}</em>`:''}</div></header>
<main class="main"><section class="pass"><div class="pass-top"><div class="pax${n>1?' m':''}"><small>Passenger${pl} (${n} adult${pl})</small>${(N.length?N:['—']).map(v=>`<strong>${esc(v)}</strong>`).join('')}</div><div class="badge"><svg class="ic"><use href="#i-check"/></svg>${x(t.st)}</div></div>${t.segs.map(sg).join('')}<div class="perf"></div>
<div class="stub"><div class="cell pnr"><small>Booking reference (PNR)</small><span>${x(t.pnr)}</span></div><div class="cell"><small>Class</small><span>${x(t.cls)}</span></div><div class="cell"><small>Trip type</small><span>${x(t.trip)}</span></div><div class="cell"><small>Passengers</small><span>${n} Adult${pl}</span></div></div></section>
<section class="bags"><div class="bag"><div class="tile"><svg class="ic"><use href="#i-bag"/></svg></div><div><small>Checked baggage</small><strong>${x(t.bc)}</strong></div></div><div class="bag"><div class="tile"><svg class="ic"><use href="#i-pack"/></svg></div><div><small>Cabin baggage</small><strong>${x(t.bh)}</strong></div></div></section>
<section class="tips"><h2>Before you travel</h2><ul><li><svg class="ic"><use href="#i-check"/></svg>Carry a valid passport and a copy of this e-ticket.</li><li><svg class="ic"><use href="#i-check"/></svg>Arrive at the airport at least 3 hours before departure.</li><li><svg class="ic"><use href="#i-check"/></svg>Keep your booking reference ready at check-in.</li></ul></section></main>
<footer class="foot"><div><h3>Contact &amp; support</h3><div class="row"><svg class="ic"><use href="#i-pin"/></svg><div><b>${x(t.company)}</b>${t.a1?'<br>'+esc(t.a1):''}${t.a2?'<br>'+esc(t.a2):''}</div></div>${t.phone?`<div class="row"><svg class="ic"><use href="#i-phone"/></svg><div>${esc(t.phone)}</div></div>`:''}</div><div class="issued">${t.agent?`<div><small>Agent</small><b>${esc(t.agent)}</b></div>`:''}<div><small>Issue date</small><b>${lf(t.issue)}</b></div></div></footer></div>`;
}

/* form */
const f=(l,p,t='text',w='',ls='')=>`<label class="f ${w}"><span>${l}</span><input type="${t}" data-p="${p}" value="${esc(get(cur,p))}"${ls?` data-sg="${ls}" autocomplete="off"`:''}></label>`,
pt=(P,i,e)=>[['Airport code','c','text','','dc'],['City','city','text','','dy'],['Airport','apt','text','w2','da'],['Terminal','term','text','w2','tm'],['Date','date','date'],['Time','time','time']].map(([l,k,t,w,ls])=>f(l,P+k,t,w,ls)).join('');
function form(){
  return `<div class="card"><h3>Passengers</h3><label class="f"><span>Full names, one per line</span><textarea rows="3" data-p="pax">${esc(cur.pax)}</textarea></label></div>
<div class="card"><h3>Booking</h3><div class="g">${f('PNR / booking ref','pnr')}${f('Status','st','text','','stl')}${f('Class','cls','text','','cl')}${f('Trip type','trip','text','','tt')}${f('Issue date','issue','date')}<span></span>${f('Checked baggage','bc')}${f('Cabin baggage','bh')}</div></div>
${cur.segs.map((s,i)=>{const P=`segs.${i}.`;return`<div class="card"><div class="row"><h3>Flight ${i+1}</h3>${cur.segs.length>1?`<button class="lnk" data-a="rm" data-i="${i}">Remove</button>`:''}</div><div class="g">${f('Airline',P+'al','text','','dn')}${f('Airline code',P+'ac','text','','dk')}${f('Flight no.',P+'fn')}${f('Duration',P+'dur')}${f('Stops',P+'stops','text','w2')}</div><h4>From</h4><div class="g">${pt(P+'f.',i,'f')}</div><h4>To</h4><div class="g">${pt(P+'t.',i,'t')}</div></div>`}).join('')}
<button class="btn ghost wide" data-a="add">+ Add flight</button>
<details class="card"><summary>Agency details</summary><div class="g">${f('Company','company')}${f('Tagline','tag')}${f('Agent name','agent','text','w2')}${f('Address line 1','a1')}${f('Address line 2','a2')}${f('Phone','phone','text','w2')}<label class="f w2"><span>Logo (pick an image, then press Save)</span><input type="file" accept="image/*" id="lg"></label></div></details>
<datalist id="stl"><option>Confirmed<option>On hold<option>Ticketed</datalist><datalist id="cl"><option>Economy<option>Premium Economy<option>Business<option>First</datalist><datalist id="tt"><option>One-way<option>Round trip<option>Multi-city</datalist>`;
}
const build=()=>{$('#pDetails').innerHTML=form()},
fit=()=>{const w=$('#wrap'),s=$('#sheet'),k=Math.min(1,w.clientWidth/794);if(!w.clientWidth)return;s.style.transform=`scale(${k})`;w.style.height=s.offsetHeight*k+'px'},
paint=()=>{$('#sheet').innerHTML=tk(cur);fit()},
toast=m=>{const e=$('#msg');e.textContent=m;e.hidden=false;clearTimeout(tm);tm=setTimeout(()=>e.hidden=true,3200)},
tab=t=>{document.body.dataset.tab=t;requestAnimationFrame(fit)},
rt=t=>t.segs.map(s=>(s.f.c||'?')+'–'+(s.t.c||'?')).join(', ');

function paintList(){
  const q=$('#q').value.toLowerCase(),a=saved.filter(t=>(t.pax+' '+t.pnr).toLowerCase().includes(q)).sort((a,b)=>b.upd-a.upd);
  $('#lst').innerHTML=a.map(t=>`<div class="item"><div><b>${esc(t.pax.split('\n')[0])||'—'}</b><small>PNR ${esc(t.pnr)||'—'}</small><small>${esc(rt(t))}, ${fd(t.segs[0]?.f.date)}</small></div><div class="acts"><button data-a="open" data-id="${t.id}">Open</button><button data-a="dup" data-id="${t.id}">Copy as new</button><button data-a="del" data-id="${t.id}">Delete</button></div></div>`).join('')||'<p class="mut">No saved tickets yet. Fill in a ticket and press Save.</p>';
}

/* storage: private database when available, browser storage otherwise */
async function init(){
  try{const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(u&&db){const c=db.collection('data/users/'+await u.id());
      store={put:(k,d)=>c.doc(k).set(d),del:k=>c.doc(k).delete(),watch:fn=>c.onSnapshot(s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{})}}}catch(e){}
  if(!store){let o={},fn;try{o=JSON.parse(localStorage.getItem('kh_tickets')||'{}')}catch(e){}
    const w=()=>{try{localStorage.setItem('kh_tickets',JSON.stringify(o))}catch(e){}fn&&fn(Object.entries(o).map(([id,d])=>({id,...d})))};
    store={put:async(k,d)=>{o[k]=d;w()},del:async k=>{delete o[k];w()},watch:g=>{fn=g;w()}}}
  store.watch(a=>{
    const st=a.find(d=>d.id==='settings');
    if(st&&!loaded){try{const o=JSON.parse(st.j);if(o.memo)MEMO={ap:[],al:[],tm:{},...o.memo};delete o.memo;AGENCY={...AGENCY,...o};$('#dls').innerHTML=lists()}catch(e){}if(!dirty){Object.assign(cur,pick(AGENCY));build()}paint()}
    loaded=1;
    saved=a.filter(d=>d.id!=='settings').map(d=>{try{return{...JSON.parse(d.j),upd:d.upd}}catch(e){return null}}).filter(Boolean);
    paintList();
  });
}

async function save(){
  if(!store)return toast('Still connecting. Try again in a moment.');
  if(!cur.pax.trim())return toast('Add at least one passenger name first.');
  try{cur.upd=Date.now();AGENCY={...AGENCY,...pick(cur)};learn();
    await store.put(cur.id,{j:JSON.stringify(cur),upd:cur.upd});await store.put('settings',{j:JSON.stringify({...AGENCY,memo:MEMO})});dirty=0;toast('Ticket saved')}
  catch(e){toast('Could not save. Please try again.')}
}
async function dl(){
  const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Ticket ${esc(cur.pnr)}</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>${$('#tcss').textContent}body{margin:0;background:#cfd5e3;padding:20px}.page{margin:0 auto}.np{text-align:center;margin-bottom:14px}@media print{html,body{height:297mm;overflow:hidden;background:none;padding:0}.np{display:none}}</style></head><body><p class="np"><button onclick="print()" style="padding:10px 20px;font-weight:700">Print / Save as PDF</button></p>${tk(cur)}<script>addEventListener('beforeprint',()=>{const p=document.querySelector('.page');p.style.zoom=1;const h=p.offsetHeight;p.style.zoom=h>1122?1122/h:1})<\/script></body></html>`;
  try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:`E-Ticket-${(cur.pnr||'ticket').replace(/\W/g,'')}.html`,data:html});toast('Ticket file ready')}
  catch(e){toast('Download is not available here. Use Print / PDF.')}
}
function openT(t,asNew){cur=JSON.parse(JSON.stringify(t));delete cur.upd;if(asNew){cur.id='t'+Date.now();cur.pax='';cur.pnr=''}dirty=1;build();paint();tab('details');window.scrollTo(0,0)}

document.addEventListener('input',e=>{
  if(e.target.id==='q')return paintList();
  const p=e.target.dataset.p;if(!p)return;setP(cur,p,e.target.value);link(p,e.target.value);dirty=1;paint();if(e.target.dataset.sg)showSug(e.target);
});
document.addEventListener('change',e=>{
  if(e.target.id!=='lg')return;const fl=e.target.files[0];if(!fl)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);AGENCY.logo=c.toDataURL('image/png');dirty=1;paint();toast('Logo added. Press Save to keep it.')};im.src=r.result};r.readAsDataURL(fl);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,t=saved.find(s=>s.id===id);
  if(a==='tab')tab(b.dataset.t);
  else if(a==='new'){cur=blank();dirty=1;build();paint();tab('details')}
  else if(a==='save')save();
  else if(a==='print'){try{window.print()}catch(er){toast('Printing is blocked here. Use Download, open the file, then print.')}}
  else if(a==='dl')dl();
  else if(a==='add'){cur.segs.push(seg());build();paint()}
  else if(a==='rm'){cur.segs.splice(+b.dataset.i,1);build();paint()}
  else if(a==='open'&&t)openT(t,0);
  else if(a==='dup'&&t)openT(t,1);
  else if(a==='del'&&t){if(b.dataset.sure){store.del(id).then(()=>toast('Ticket deleted'))}else{b.dataset.sure=1;b.textContent='Tap again'}}
});
window.addEventListener('resize',fit);
window.addEventListener('beforeprint',()=>{const s=$('#sheet'),p=s.querySelector('.page');s.style.zoom=1;const h=p.offsetHeight;s.style.zoom=h>1122?1122/h:1});
window.addEventListener('afterprint',()=>{$('#sheet').style.zoom=''});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.sg)showSug(e.target)});
document.addEventListener('keydown',e=>{if(!SG)return;const n=SG.items.length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SG.i=(SG.i+(e.key==='ArrowDown'?1:-1)+n)%n;mark();$('#sug').children[SG.i].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&SG.i>=0){e.preventDefault();pickSug(SG.i)}
  else if(e.key==='Escape')hideSug()});
document.addEventListener('mousedown',e=>{if(e.target.closest('#sug'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#sug')){if(SG)SG.keep=1}else if(!(e.target.dataset&&e.target.dataset.sg))hideSug()});
document.addEventListener('click',e=>{const r=e.target.closest('.si');if(r&&SG)pickSug(+r.dataset.i)});
document.addEventListener('focusout',()=>setTimeout(()=>{if(SG&&!SG.keep&&!(document.activeElement&&document.activeElement.dataset.sg))hideSug()},150));
window.addEventListener('scroll',e=>{if(SG&&e.target!==$('#sug'))hideSug()},true);
$('#dls').innerHTML=lists();build();paint();init();
})();
</script>
</body>
</html>
